# Workflow name
name: Build and Push Docker Image

# Runs workflows whenever a commit to the main branch occurs
on:
    push:
        branches: [main]

# The workflow jobs
jobs:
    build:

        runs-on: ubuntu-latest

        permissions:
            contents: read # gives permission to read github repo
            packages: write # gives permission to upload/publish the docker image

        steps:
            - name: Check out Repo
              uses: actions/checkout@v4

            - name: Login to GitHub container registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io # Storage server for Docker images so its accesible from anywhere
                username: ${{github.actor}} # Holds github username of whoever triggered the run
                password: ${{secrets.GITHUB_TOKEN}} # auto-generated token by GH every single workflow run then destroyed after

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v6 # Builds and Docker image and pushes it into a registry
              with:
                context: . # Tells where Dockerfile and code are located
                push: True # Pushes Image after building
                tags: ghcr.io/youssef080808/brawl-api:latest # Full name/address image will be given once uploaded
    
    deploy:
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{secrets.AWS_ACCESS_ID}}
                aws-secret-access-key: ${{secrets.AWS_SECRET_KEY}}
                aws-region: eu-north-1
            
            - name: Deploy new image to EC2 via SSM
              run: | 
                aws ssm send-command \
                    --instance-ids "${{secrets.EC2_INSTANCE_ID}}" \
                    --document-name "AWS-RunShellScript" \
                    --parameters 'commands=[
                        "docker pull ghcr.io/youssef080808/brawl-api:latest",
                        "docker rm -f brawl-api",
                        "docker run -d --name brawl-api --restart unless-stopped -p 127.0.0.1:8000:8000 --env-file /etc/brawl-api.env -v /home/ec2-user/brawl-data:/data ghcr.io/youssef080808/brawl-api:latest"
                    ]'




    
    

        


